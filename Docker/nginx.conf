server {
    listen 80;
    root /var/www/html/public;
    index index.php index.html;

    # Reflect the actual connection scheme ($https = "on" only for TLS), so a
    # plain-HTTP local/container run generates http URLs. Production behind a
    # TLS proxy still gets https URLs: AppServiceProvider forces HTTPS in
    # APP_ENV=production, and the real proxy sets X-Forwarded-Proto.
    add_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}