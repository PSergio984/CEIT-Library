[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stderr_logfile=/var/log/php-fpm.err.log
stdout_logfile=/var/log/php-fpm.out.log

[program:queue-worker]
command=php /var/www/html/artisan queue:work --tries=3 --backoff=5 --max-time=3600
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=30
stderr_logfile=/var/log/queue-worker.err.log
stdout_logfile=/var/log/queue-worker.out.log

[program:scheduler]
command=php /var/www/html/artisan schedule:work
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=30
stderr_logfile=/var/log/scheduler.err.log
stdout_logfile=/var/log/scheduler.out.log